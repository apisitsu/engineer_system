map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Uploads. Both of these are nginx defaults that are far too small for this app and
    # fail in ways that do not name themselves:
    #  - client_max_body_size defaults to 1m, so anything larger comes back 413 while the
    #    backend is configured to accept 500 MB (express-fileupload in server.js).
    #  - the body/read timeouts default to 60s, which cuts a slow upload and a long
    #    request (the Tooling Inspection import runs ~40-90s) mid-flight. The client
    #    never gets a reply, so it reads as a hang rather than an error.
    # Production reaches the API directly on :2005 and bypasses this file, but the Docker
    # compose stack and anyone hitting port 80 go through here.
    client_max_body_size 500m;
    client_body_timeout  300s;
    send_timeout         300s;

    # Serve React Frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # ถ้าหาไฟล์ ($uri) หรือโฟลเดอร์ ($uri/) ไม่เจอ ให้วิ่งกลับไปหา /index.html
        try_files $uri $uri/ /index.html;
    }

    # CAD/CAM constraint-solver assets (planegcs.js + planegcs.wasm, served from
    # the React build's public/wasm/). Deliberately its own location, for two
    # reasons that both only bite in production:
    #
    #  - MIME. The .js is pulled in by a dynamic `import()` inside the sketch
    #    worker, and browsers refuse a module script that is not served with a
    #    JavaScript type. The .wasm wants application/wasm to stream-compile —
    #    nginx only learned that type in 1.21.1, so declare both here rather than
    #    depend on the host's mime.types vintage.
    #  - Failure mode. The catch-all `/` above answers a missing file with
    #    index.html and HTTP 200, so a wasm/ file that never made it into the
    #    deploy comes back as HTML and surfaces as "Unexpected token '<'" from the
    #    import — which says nothing about the real problem. Here it 404s.
    #
    # NOT immutable-cached on purpose: these two filenames carry no content hash,
    # so upgrading @salusoft89/planegcs has to be able to reach browsers that
    # already hold the old copy. Let them revalidate.
    location /wasm/ {
        root /usr/share/nginx/html;
        types {
            application/wasm wasm;
            text/javascript  js;
        }
        default_type application/octet-stream;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:2005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Without these the default 60s applies and long endpoints — file uploads, and
        # the Tooling Inspection import — are cut with no reply reaching the browser.
        proxy_connect_timeout 60s;
        proxy_send_timeout   300s;
        proxy_read_timeout   300s;
    }

    # Proxy Auth related endpoints
    location /auth/ {
        proxy_pass http://backend:2005/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy File Uploads handling
    location /uploads/ {
        proxy_pass http://backend:2005/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket handling
    location /ws {
        proxy_pass http://backend:2005/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}